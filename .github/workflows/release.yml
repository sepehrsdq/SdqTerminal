name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Read project version
        id: version
        shell: pwsh
        run: |
          $version = & ./scripts/get-version.ps1
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Publish application
        run: >-
          dotnet publish src/SdqTerminal/SdqTerminal.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishTrimmed=false
          --output artifacts/publish/win-x64

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = (Get-Command ISCC.exe -ErrorAction Stop).Source
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" installer\SdqTerminal.iss

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: pwsh
        run: |
          $installer = "artifacts/release/SdqTerminal-Setup-$env:VERSION-x64.exe"
          $releaseExists = gh release view $env:TAG 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG $installer --clobber
          } else {
            gh release create $env:TAG $installer `
              --title "SdqTerminal $env:VERSION" `
              --generate-notes `
              --target $env:GITHUB_SHA
          }
